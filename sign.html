<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign the Friendship Charter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e9f1;--paper:#fffefb;--ink:#14213d;--mute:#58627a;--gold:#b8892b;--line:#cfd5e3;--ok:#2e7d5b;--wait:#a86a12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 Newsreader,Georgia,serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.paper{max-width:780px;margin:28px auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:50px 42px 34px;position:relative;box-shadow:0 18px 50px rgba(20,33,61,.14)}
.paper::before{content:"";position:absolute;inset:10px;border:2px solid var(--gold);border-radius:3px;pointer-events:none;opacity:.55}
header{text-align:center}
.seal{width:84px;height:84px;display:block;margin:0 auto 12px}
h1{font:800 clamp(30px,7vw,46px)/1.08 Fraunces,Georgia,serif;margin:0 0 8px}
h2{font:800 23px/1.25 Fraunces,Georgia,serif;margin:0 0 10px;display:flex;gap:12px;align-items:center}
h3{font:800 22px Fraunces,Georgia,serif;margin:8px 0}
.sub{color:var(--mute);font:italic 18px Fraunces,Georgia,serif;margin:0 auto 18px;max-width:32em}
hr{border:0;border-top:1px solid var(--line);margin:26px 0}
label.nm{display:block;text-align:left;font:600 15px Fraunces,serif;color:var(--gold);margin-top:6px}
input[type=text],textarea{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
textarea{font:14px/1.4 ui-monospace,Consolas,monospace;min-height:96px;word-break:break-all}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--ink);margin-top:5px}
.sec{display:flex;gap:12px;margin:0 0 12px}
.sec b,.pre{font-family:Fraunces,Georgia,serif}
.sec b{font-weight:600}
.pre{font-style:italic}
p{margin:0 0 12px}
ol.l{margin:-4px 0 12px 34px;padding-left:1.3em}
ol.l li::marker{color:var(--gold);font-weight:600}
.bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font:600 15px Fraunces,serif;margin:14px 0;z-index:3}
.btn{font:600 17px Fraunces,Georgia,serif;background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:6px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink)}
.bar .btn.alt{color:#fff;border-color:#fff;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.signbox{border:2px dashed var(--gold);border-radius:6px;padding:20px;margin-top:20px}
.sig{font:italic 800 38px/1.2 Fraunces,Georgia,serif;border-bottom:2px solid var(--ink);padding:6px 4px;margin:14px 0 16px;overflow-wrap:anywhere}
.badge{display:inline-block;font:800 14px Fraunces,serif;letter-spacing:.08em;padding:5px 12px;border-radius:99px;color:#fff;margin-bottom:10px}
.badge.p{background:var(--wait)}.badge.a{background:var(--ok)}
.tick{color:var(--ok);font-weight:700}.cross{color:#9b2c2c;font-weight:700}
.rv li{margin:2px 0;font-size:16px}.rv ul{margin:2px 0 10px;padding-left:20px;list-style:none}
.small{font-size:15px;color:var(--mute)}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:15px;padding:0}
dialog{border:2px solid var(--gold);border-radius:10px;padding:26px 24px;max-width:430px;width:calc(100% - 32px);text-align:center;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(20,33,61,.6)}
dialog .seal{width:64px;height:64px}
@media(max-width:620px){body{font-size:18px}.paper{margin:0;border-radius:0;border-left:0;border-right:0;padding:40px 20px 28px}.paper::before{inset:6px}}
</style>
</head>
<body>
<main class="paper">
<header>
<svg class="seal" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#b8892b"/><circle cx="50" cy="50" r="38" fill="none" stroke="#fffefb" stroke-width="2" stroke-dasharray="3 4"/><polygon points="50,24 57,43 77,43 61,55 67,75 50,63 33,75 39,55 23,43 43,43" fill="#14213d"/></svg>
<h1>Sign the Friendship Charter</h1>
<p class="sub">Read each article, tick what you accept, add your name and e-sign. Aarav will review and approve your signature.</p>
</header>

<div id="v-sign">
<label class="nm" for="nm">Your full name</label>
<input type="text" id="nm" maxlength="60" autocomplete="name" placeholder="Type your name here">
<hr>
<div id="doc"></div>
<div class="bar"><span id="cnt"></span><button class="btn alt" id="all" type="button">Accept all</button></div>
<div class="signbox">
<h2>Sign here</h2>
<p>When you are done ticking, press e-sign.</p>
<button class="btn" id="esign" type="button" disabled>✍ E-sign</button>
<div id="ack" hidden>
<p id="acktx"></p>
<div class="sig" id="sig"></div>
<button class="btn" id="sub" type="button">Submit</button>
</div>
</div>
</div>

<div id="v-status" hidden></div>
<div id="v-admin" hidden></div>
</main>

<dialog id="dlg">
<svg class="seal" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#b8892b"/><polygon points="50,24 57,43 77,43 61,55 67,75 50,63 33,75 39,55 23,43 43,43" fill="#14213d"/></svg>
<h3>One last look before you send</h3>
<p id="dtx"></p>
<div class="row" style="justify-content:center"><button class="btn alt" id="dno" type="button">Wait, let me re-read</button><button class="btn" id="dyes" type="button">Yes, send it</button></div>
</dialog>

<script>
var D=[
["Preamble",[[0,"We, the two founding members of this friendship, hereby declare that we like each other far too much to leave things to chance. This Charter exists to protect our bond, keep the laughs flowing, and ensure that neither of us ever has to wonder where we stand. It is binding in spirit, enforceable by snacks, and non-negotiable on the matter of loyalty."]],1],
["Article I: Purpose",[[0,"To provide mutual support, shared laughter, and reliable access to snacks."]]],
["Article II: Rights of Members",[[0,"Every member has the right to be heard, to vent without being fixed, and to be reminded of past bad haircuts only in a loving way."]]],
["Article III: Duties of Members",[[0,"Show up when it matters. Reply to messages within a reasonable time (ignoring each other for more than 72 hours requires a formal apology). Keep each other’s secrets."]]],
["Article IV: Code of Conduct",[[0,"No ghosting. No canceling plans on the day unless there is a real emergency (being “tired” is a gray area, and the Council will rule on it). For the purposes of this Charter, the Council consists of both members, and in case of a tie, snacks decide."]]],
["Article V: Dispute Resolution",[[0,"Conflicts are settled by honest conversation, followed by food. Pettiness is permitted, grudges are not."]]],
["Article VI: Amendments",[[0,"This charter may be changed by majority vote, or whenever someone makes a really good argument. (See also Article XIX, which sets out the exact procedure.)"]]],
["Article VII: Communication",[["Section 1. Calls.","The members shall speak on a call at least once or twice a week. Calls are the heartbeat of this friendship and shall not be skipped without a decent reason."],["Section 2. Texts.","Neither member shall go more than two (2) days without texting the other. Silence beyond this limit is considered a minor offense and shall be treated under Article XVIII."],["Section 3. Reply Time.","Replies should be prompt and made with genuine effort. A “seen” with no reply is a crime against friendship unless followed by a reply within a reasonable time."],["Section 4. Mode of Communication.","Calls and texts are equally valid, but neither may fully replace the other. A friendship run entirely on memes is acceptable only in moderation."]]],
["Article VIII: Time Together",[["Section 1. Current Status.","The members acknowledge that they have not yet met in person. This is recorded here as a historic fact and a future plot twist."],["Section 2. Future Meetings.","The members shall decide together, and in good time, when and how they will begin meeting. Neither shall be pressured, and neither shall disappear when the plan is made."],["Section 3. First Meeting.","The first meeting shall be treated as a ceremonial occasion. Expect hugs, awkward silence for the first four minutes, and photographic evidence."]]],
["Article IX: Flirting",[["Section 1. The Three Conditions.","Flirting between the members is permitted only when all three of the following conditions are met:",["<b>Mood.</b> Both members are in the mood for it. Flirting at a bad moment is just noise.","<b>Mutual Agreement.</b> Both members are comfortable and openly agree to it. Either member may call a stop at any time, no explanation needed.","<b>Relationship Status.</b> Both members are single. If either member is in a relationship, flirting is suspended until further notice."]],["Section 2. No Harm to the Friendship.","Flirting is a game, not a contract. It shall never change, damage, or awkwardly complicate the friendship. If it ever does, it ends, and the friendship continues as before."]]],
["Article X: Other Friends and Partners",[["Section 1. Partners May Change.","The members acknowledge that partners may come and go over time. This is natural, and each member shall support the other through all such changes."],["Section 2. The Friendship Shall Not Change.","No matter who enters or leaves their lives, the friendship remains constant and shall not be reduced, replaced, or renegotiated because of a new person."],["Section 3. No Third-Party Interference.","No third person, whether friend, partner, relative, or stranger on the internet, shall interfere in this friendship, influence its terms, or come between the members. Any outsider who tries shall be politely ignored."]]],
["Article XI: Secrets and Privacy",[["Section 1. The Vault.","Everything the members discuss with each other stays between them. The friendship is a vault, and both members hold a key."],["Section 2. Permission Required.","Nothing shall be shared with any outside person without the explicit permission of the other member. “I thought they wouldn’t mind” is not permission."],["Section 3. Screenshots.","Screenshots of private conversations shall not be shown to anyone without permission. Violators shall face the full weight of Article XVIII."]]],
["Article XII: Honesty",[["Section 1. Be Blunt.","The members shall be direct and blunt with each other. Sugarcoating is allowed only on actual desserts."],["Section 2. Nothing to Hide.","Neither member shall hide anything from the other. Where there is a truth, it shall be told."],["Section 3. Spirit of Honesty.","Bluntness is meant to help, not to hurt. Hard truths shall be spoken with care, even if the care is wrapped in sarcasm."]]],
["Article XIII: Fights and Apologies",[["Section 1. Do Not Fight.","The members shall make every effort not to fight with each other."],["Section 2. If a Fight Occurs.","Should a fight happen despite Section 1, it shall be resolved as soon as possible. Delay is not a strategy."],["Section 3. Quick and Apologetic.","Resolution shall be swift and apologetic. Both members shall own their part, say sorry properly, and move on without scorekeeping."],["Section 4. Why It Matters.","The members recognize that they cannot stay without each other. Therefore no fight, however big, shall be allowed to outlive the day it began if it can possibly be avoided."]]],
["Article XIV: Emotional Support",[["Section 1. Always Check In.","The members shall check in on each other often, and more than once when things are hard. One “how are you” is a start, not a finish."],["Section 2. Always Have Each Other’s Back.","In every situation, in every argument with outsiders, and in every moment of doubt, each member stands firmly with the other."],["Section 3. Venting.","The right to vent, as granted in Article II, remains fully protected. Advice shall be offered only when asked for, or when the situation is clearly on fire."]]],
["Article XV: Jokes and Teasing",[["Section 1. No Limits.","There shall be no limit on jokes and teasing between the members. Mocking each other is not only allowed but encouraged and considered a core activity."],["Section 2. Fun Above All.","All teasing is made in love and fun. Both members consent to being roasted at any time, in any group chat, on any day of the week."]]],
["Article XVI: Safety",[[0,"The members shall look out for each other’s well-being at all times. Each shall let the other know when they have reached home safe and shall be available in case of trouble. Beyond this, the matter shall be left as it is."]]],
["Article XVII: Total Sharing",[["Section 1. Share Everything.","The members shall share each and every thing with each other, including the tiniest, most ordinary details of their day. Nothing is too small. The color of your lunch is a valid update."],["Section 2. Snaps Without Asking.","Each member may send snaps to the other at any time, without asking for permission first and without needing a reason. No “can I send you something?” Just send it."],["Section 3. Equal Exchange.","Sharing flows both ways. Each member shall make a reasonable effort to respond in kind and not leave the other talking to a wall."]]],
["Article XVIII: Breach of the Charter",[["Section 1. What Counts as a Breach.","A breach occurs when a member violates any Article of this Charter."],["Section 2. The Penalty.","The member who breaches the Charter must do whatever the other member says, as a penalty. The wronged member holds the power to name the penalty."],["Section 3. Limits of the Penalty.","The penalty shall be reasonable. It must not be unsafe, illegal, or truly humiliating, and it should preferably involve food, memes, or embarrassing public declarations."],["Section 4. Completion.","Once the penalty is carried out, the matter is closed, and it shall not be brought up again as ammunition, except in jokes."]]],
["Article XIX: Amending the Charter",[["Section 1. Mutual Consent.","Both members have equal power to change this Charter. Any amendment requires the agreement of both."],["Section 2. Procedure.","A member who wants a change shall propose it openly. If both agree, it becomes part of the Charter. If not, the existing text stands."],["Section 3. Permanence.","The friendship itself is not up for amendment."]]],
["Article XX: Final Provisions",[[0,"This Charter takes effect from the moment both members sign it, whether in ink, in text, or in a dramatic voice message. It is meant to be read, laughed at, remembered, and, when necessary, quoted dramatically in an argument."]]]
];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function wipe(){try{localStorage.removeItem('fc_req');localStorage.removeItem('fc_ok')}catch(e){}}
function fmt(t){return new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function show(v){['sign','status','admin'].forEach(function(x){$('v-'+x).hidden=x!==v});scrollTo(0,0)}

var L=[],AL={};
D.forEach(function(a,ai){if(a[2])return;AL[ai]=[];a[1].forEach(function(s,si){AL[ai].push(L.length);L.push([ai,si])})});
var ch=L.map(function(){return false});

var h="";
D.forEach(function(a,ai){
h+='<section><h2>'+(a[2]?'':'<input type="checkbox" class="ca" data-a="'+ai+'" aria-label="Accept '+esc(a[0])+'">')+'<span>'+a[0]+'</span></h2>';
a[1].forEach(function(s,si){
if(s[0]===0){h+='<p'+(a[2]?' class="pre"':'')+'>'+s[1]+'</p>';return}
h+='<p class="sec"><input type="checkbox" class="cl" data-k="'+AL[ai][si]+'" aria-label="Accept '+esc(s[0])+'"><span><b>'+s[0]+'</b> '+s[1]+'</span></p>';
if(s[2])h+='<ol class="l">'+s[2].map(function(x){return'<li>'+x+'</li>'}).join('')+'</ol>';
});
h+='</section>'+(ai<D.length-1?'<hr>':'');
});
$('doc').innerHTML=h;

function cnt(){return ch.filter(Boolean).length}
function nm(){return $('nm').value.trim()}
function sync(){
document.querySelectorAll('.cl').forEach(function(i){i.checked=ch[i.dataset.k]});
document.querySelectorAll('.ca').forEach(function(i){var ks=AL[i.dataset.a],n=ks.filter(function(k){return ch[k]}).length;i.checked=n===ks.length;i.indeterminate=n>0&&n<ks.length});
$('cnt').textContent=cnt()+' of '+L.length+' sections accepted';
var ok=nm().length>1&&cnt()>0;
$('esign').disabled=!ok;
if(!ok)$('ack').hidden=true;else if(!$('ack').hidden)fillAck();
}
$('doc').addEventListener('change',function(e){var t=e.target;
if(t.dataset.a!==undefined)AL[t.dataset.a].forEach(function(k){ch[k]=t.checked});
else if(t.dataset.k!==undefined)ch[t.dataset.k]=t.checked;
sync()});
$('nm').addEventListener('input',sync);
$('all').onclick=function(){var every=cnt()===L.length;ch=ch.map(function(){return !every});sync()};
function fillAck(){
$('acktx').innerHTML='By e-signing, I, <b>'+esc(nm())+'</b>, am accepting <b>'+cnt()+' of '+L.length+'</b> sections of the Friendship Charter and promise to abide by them.';
$('sig').textContent=nm();
}
$('esign').onclick=function(){fillAck();$('ack').hidden=false;$('ack').scrollIntoView({behavior:'smooth',block:'center'})};
$('sub').onclick=function(){
var miss=L.length-cnt();
$('dtx').innerHTML='You are about to send your signature to Aarav. By sending it, you promise to abide by <b>'+cnt()+' of '+L.length+'</b> sections of the Friendship Charter, snack penalties included. Once sent, it can’t be edited. Only Aarav can approve it.'+(miss?'<br><br><b>Heads up:</b> '+miss+' section'+(miss>1?'s are':' is')+' not ticked.':'');
$('dlg').showModal()};
$('dno').onclick=function(){$('dlg').close()};
$('dyes').onclick=function(){
$('dlg').close();
var r={id:Math.random().toString(36).slice(2,8).toUpperCase(),n:nm(),t:Date.now(),b:ch.map(function(x){return x?1:0}).join('')};
wipe();save('fc_req',r);route();
};

function msgFor(r){return 'Friendship Charter signing request from '+r.n+' (ref '+r.id+'). Request code:\n'+enc(r)}
function status(){
var r=load('fc_req'),ok=load('fc_ok'),v=$('v-status'),n=r?r.b.split('').filter(function(x){return x==='1'}).length:0;
if(r&&ok&&ok.i===r.id){
v.innerHTML='<div class="badge a">✓ APPROVED</div><h2>The Friendship Charter is in effect</h2><p><b>'+esc(r.n)+'</b>’s signature on '+n+' of '+L.length+' sections was approved by Aarav on '+fmt(ok.t)+'.</p><p class="small">Reference '+r.id+'</p><div class="row"><a class="btn" href="index.html">Read the charter</a></div><button class="lnk" id="rs">Start over</button>';
}else{
var code=enc(r);
v.innerHTML='<div class="badge p">● PENDING</div><h2>Waiting for Aarav to approve</h2><p>Thank you, <b>'+esc(r.n)+'</b>. Your signature on '+n+' of '+L.length+' sections is recorded. Reference <b>'+r.id+'</b>, signed '+fmt(r.t)+'.</p><p><b>Last step:</b> send this request code to Aarav so he can review and approve it.</p><textarea id="code" readonly>'+code+'</textarea><div class="row"><button class="btn" id="cp" type="button">Copy code</button><a class="btn alt" id="wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(msgFor(r))+'">Send on WhatsApp</a></div><hr><p class="small">Already approved? Paste the approval code Aarav sent you.</p><input type="text" id="okin" placeholder="Approval code"><div class="row"><button class="btn alt" id="okb" type="button">Check approval</button></div><p id="okm" class="small"></p><button class="lnk" id="rs">Start over</button>';
$('cp').onclick=function(){$('code').select();try{navigator.clipboard.writeText(code)}catch(e){document.execCommand('copy')};$('cp').textContent='Copied ✓'};
$('okb').onclick=function(){try{var o=dec($('okin').value);if(o.i===r.id){save('fc_ok',o);status()}else $('okm').textContent='That approval is for a different request.'}catch(e){$('okm').textContent='That code doesn’t look right.'}};
}
$('rs').onclick=function(){if(confirm('Discard this signature and start over?')){wipe();location.hash='';location.reload()}};
}

function admin(){
var v=$('v-admin');
v.innerHTML='<h2>Approvals desk</h2><p class="small">Paste the request code your friend sent you.</p><textarea id="ain" placeholder="Request code"></textarea><div class="row"><button class="btn" id="arev" type="button">Review request</button></div><div id="aout"></div>';
$('arev').onclick=function(){
var o;try{o=dec($('ain').value);if(!o.b||o.b.length!==L.length)throw 0}catch(e){$('aout').innerHTML='<p class="cross">That code doesn’t look right, or it came from a different version of the charter.</p>';return}
var n=o.b.split('').filter(function(x){return x==='1'}).length,s='';
D.forEach(function(a,ai){if(a[2])return;
s+='<li><b>'+a[0]+'</b><ul>'+AL[ai].map(function(k,si){var it=a[1][si],on=o.b[k]==='1';return'<li><span class="'+(on?'tick':'cross')+'">'+(on?'✓':'✗')+'</span> '+(it[0]===0?'Whole article':it[0].replace(/\.$/,''))+'</li>'}).join('')+'</ul></li>'});
$('aout').innerHTML='<hr><p><b>Name:</b> '+esc(o.n)+'<br><b>Reference:</b> '+esc(o.id)+'<br><b>Signed:</b> '+fmt(o.t)+'<br><b>Accepted:</b> '+n+' of '+L.length+' sections'+(n<L.length?' <span class="cross">(not all ticked)</span>':'')+'</p><ul class="rv" style="padding:0;list-style:none">'+s+'</ul><div class="row"><button class="btn" id="apr" type="button">✓ Approve and sign</button></div><div id="aok"></div>';
$('apr').onclick=function(){
var tok=enc({i:o.id,n:o.n,t:Date.now()}),link=location.origin+location.pathname+'#ok='+tok;
$('aok').innerHTML='<div class="badge a">✓ APPROVED</div><p>Send this approval link back to '+esc(o.n)+':</p><textarea id="alk" readonly>'+link+'</textarea><div class="row"><button class="btn" id="acp" type="button">Copy link</button><a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Your Friendship Charter signature is approved ✓ '+link)+'">Send on WhatsApp</a></div>';
$('acp').onclick=function(){$('alk').select();try{navigator.clipboard.writeText(link)}catch(e){document.execCommand('copy')};$('acp').textContent='Copied ✓'};
};
};
}

function route(){
var hs=location.hash;
if(hs==='#admin'){admin();show('admin');return}
if(hs.indexOf('#ok=')===0){
try{var o=dec(hs.slice(4)),r=load('fc_req');
if(r&&r.id===o.i)save('fc_ok',o);
else if(!r){$('v-status').innerHTML='<div class="badge a">✓ APPROVED</div><h2>The Friendship Charter is in effect</h2><p><b>'+esc(o.n)+'</b>’s signature was approved by Aarav on '+fmt(o.t)+'.</p><p class="small">Reference '+esc(o.i)+'</p><div class="row"><a class="btn" href="index.html">Read the charter</a></div>';show('status');return}
}catch(e){}
}
if(load('fc_req')){status();show('status')}else{sync();show('sign')}
}
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
